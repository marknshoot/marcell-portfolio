<!DOCTYPE html>
<html lang="en" class="book-ok">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book frames</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
    <style>
      body { margin: 0; background: #f3efe6; }
      .folio { display: block !important; width: min(900px, 100%); margin: 16px auto; }
      .folio-sticky { position: relative; top: auto; }
      .folio-spacer { display: none; }
    </style>
  </head>
  <body>
    <div class="folio" id="folio">
      <div class="folio-sticky">
        <ol class="book-chapters">
          <li><button type="button" data-page="0">01 Toko</button></li>
          <li><button type="button" data-page="1">02 Credit</button></li>
          <li><button type="button" data-page="2">03 RAG</button></li>
        </ol>
        <div class="book is-shut" id="book">
          <canvas id="book-canvas" width="900" height="480"></canvas>
          <div class="holo-beam" aria-hidden="true"></div>
          <div class="book-hover" id="book-hover">
            <article class="book-float is-on" data-page="0">
              <span class="tag">In progress</span>
              <h3>Toko Marcell</h3>
              <p>Hybrid search, recommendations, copilot.</p>
            </article>
            <article class="book-float" data-page="1" hidden>
              <span class="tag tag-done">Finished</span>
              <h3>Credit-Risk Deep-Dive</h3>
              <p>Grouped split, honest evaluation.</p>
            </article>
            <article class="book-float" data-page="2" hidden>
              <span class="tag tag-plan">Planned</span>
              <h3>RAG Research Agent</h3>
              <p>Query, retrieve, cited answer.</p>
            </article>
          </div>
        </div>
        <p class="folio-hint"><span>frame</span><span class="folio-count" id="folio-count">closed</span></p>
      </div>
    </div>
    <script type="module" src="book.js"></script>
  </body>
</html>
